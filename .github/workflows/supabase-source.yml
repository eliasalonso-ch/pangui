name: Supabase Source Guard

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate newly added migration names
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t added < <(git diff --name-only --diff-filter=A "$BASE_SHA" "$GITHUB_SHA" -- supabase/migrations)

          for path in "${added[@]}"; do
            name="$(basename "$path")"
            if [[ ! "$name" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "Invalid migration filename: $path"
              echo "Use a unique UTC timestamp: YYYYMMDDHHMMSS_description.sql"
              exit 1
            fi

            version="${name%%_*}"
            matches="$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" | wc -l)"
            if [ "$matches" -ne 1 ]; then
              echo "Duplicate migration version $version"
              find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql"
              exit 1
            fi
          done

      - name: Protect fetched production history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t historical_changes < <(
            git diff --name-only --diff-filter=MD "$BASE_SHA" "$GITHUB_SHA" -- supabase/migrations \
              | awk -F/ '$3 ~ /^[0-9]{14}_/ && substr($3, 1, 14) <= "20260706142925"'
          )
          if [ "${#historical_changes[@]}" -gt 0 ]; then
            echo "Fetched production migrations are immutable:"
            printf ' - %s\n' "${historical_changes[@]}"
            exit 1
          fi

      - name: Validate complete migration inventory
        shell: bash
        run: |
          declare -A seen
          while IFS= read -r path; do
            name="$(basename "$path")"
            if [[ ! "$name" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "Invalid canonical migration filename: $path"
              exit 1
            fi
            version="${name%%_*}"
            if [[ -n "${seen[$version]:-}" ]]; then
              echo "Duplicate migration version $version: ${seen[$version]} and $path"
              exit 1
            fi
            seen[$version]="$path"
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort)

      - name: Verify mirrored export builders are in sync
        shell: bash
        run: |
          # lib/*.ts and supabase/functions/_shared/*.ts are hand-mirrored: Deno
          # needs .ts import extensions, which break Next.js. They drifted once
          # and the emailed report silently served stale code for ten weeks.
          # Only the header comment and those import extensions may differ.
          status=0
          for name in excel-export-shared csv-export-shared; do
            web="lib/$name.ts"
            deno="supabase/functions/_shared/$name.ts"
            norm() { sed -E 's|^[[:space:]]*//.*$||; s|(from "\./[a-z-]+)\.ts"|\1"|' "$1"; }
            if ! diff -q <(norm "$web") <(norm "$deno") >/dev/null; then
              echo "Mirror drift: $web vs $deno"
              diff <(norm "$web") <(norm "$deno") || true
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Sync both copies, then redeploy: supabase functions deploy export-schedules-cron"
            exit 1
          fi
          echo "Export builder mirrors in sync."

      - name: Remind reviewers that production push is blocked
        run: |
          echo "Canonical source: pangui/supabase"
          echo "Read docs/work-orders/SUPABASE-CANONICALIZATION.md before deployment."
